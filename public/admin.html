<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopNova - Admin Login</title>

    <link rel="stylesheet" href="admin.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #eefaff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .admin-login-container {
            width: 100%;
            max-width: 538px;
            background: #ffffff;
            border-radius: 25px;
            padding: 50px 43px 43px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.10);
            position: relative;
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            font-size: 38px;
            font-weight: 800;
            color: #111827;
            line-height: 1.1;
        }

        .brand h1 span {
            color: #2563eb;
        }

        .brand p {
            margin-top: 10px;
            font-size: 21px;
            color: #64748b;
        }

        .login-form {
            margin-top: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 20px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 9px;
        }

        .form-group input {
            width: 100%;
            height: 55px;
            border: 1px solid #dbe1e8;
            border-radius: 12px;
            padding: 0 18px;
            font-size: 16px;
            outline: none;
            background: #ffffff;
            color: #111827;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .login-button {
            width: 100%;
            height: 51px;
            border: none;
            border-radius: 11px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s ease;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .login-button:disabled {
            opacity: 0.75;
            cursor: not-allowed;
        }

        .back-to-shop {
            position: absolute;
            right: -155px;
            top: 290px;
            color: #2563eb;
            font-size: 21px;
            font-weight: 700;
            text-decoration: underline;
            white-space: nowrap;
        }

        .back-to-shop:hover {
            color: #1d4ed8;
        }

        /* Hidden initially */
        #loginStatus {
            display: none;
            margin-top: 15px;
            font-size: 18px;
            font-weight: 700;
            color: #111827;
        }

        #loginError {
            display: none;
            margin-top: 15px;
            font-size: 16px;
            font-weight: 600;
            color: #dc2626;
        }

        @media (max-width: 760px) {
            body {
                padding: 20px;
            }

            .admin-login-container {
                max-width: 540px;
                padding: 40px 28px;
            }

            .back-to-shop {
                position: static;
                display: block;
                text-align: center;
                margin-top: 25px;
                font-size: 18px;
            }

            .brand h1 {
                font-size: 34px;
            }

            .brand p {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <div class="admin-login-container">

        <div class="brand">
            <h1>Shop<span>Nova</span></h1>
            <p>Admin Dashboard</p>
        </div>

        <form id="adminLoginForm" class="login-form">

            <div class="form-group">
                <label for="username">Username or Email</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >
                Login
            </button>

            <!-- Initially hidden -->
            <div id="loginStatus">
                Logging in...
            </div>

            <div id="loginError"></div>

        </form>

        <a href="/" class="back-to-shop">
            ← Back to Shop
        </a>

    </div>


    <script>
        const loginForm = document.getElementById("adminLoginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("loginButton");
        const loginStatus = document.getElementById("loginStatus");
        const loginError = document.getElementById("loginError");

        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // Hide previous messages
            loginStatus.style.display = "none";
            loginError.style.display = "none";
            loginError.textContent = "";

            if (!username || !password) {
                loginError.textContent = "Please enter username/email and password.";
                loginError.style.display = "block";
                return;
            }

            // Show ONLY after clicking Login
            loginStatus.style.display = "block";
            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {

                const response = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: username,
                        email: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        data.error ||
                        "Invalid username/email or password."
                    );
                }

                /*
                 * Save admin token returned by backend
                 */
                if (data.token) {
                    localStorage.setItem("shopnova_admin_token", data.token);
                }

                /*
                 * Keep login status visible briefly,
                 * then open admin dashboard.
                 */
                setTimeout(() => {
                    window.location.href = "/admin";
                }, 500);

            } catch (error) {

                loginStatus.style.display = "none";

                loginError.textContent =
                    error.message ||
                    "Login failed. Please try again.";

                loginError.style.display = "block";

                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>

</body>
</html>
