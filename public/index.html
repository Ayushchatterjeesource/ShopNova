<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ShopNova - Modern Full-Stack Online Store"
    >

    <title>ShopNova - Online Store</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<header class="header">

    <div class="container nav">

        <a href="#/" class="logo">
            Shop<span>Nova</span>
        </a>

        <nav class="nav-links">

            <a href="#/">Home</a>

            <a href="#/products">
                Products
            </a>

            <a href="#/cart">
                Cart
                <span
                    id="cartCount"
                    class="cart-count"
                >0</span>
            </a>

            <a
                href="/admin"
                class="admin-link"
            >
                Admin
            </a>

        </nav>

    </div>

</header>


<main>

    <section class="search-section">

        <div class="container search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >

            <button id="searchBtn">
                Search
            </button>

        </div>

    </section>


    <div
        id="app"
        class="container app-container"
    >
        <div class="loading">
            Loading ShopNova...
        </div>
    </div>

</main>


<footer class="footer">

    <p>
        This app is made by Ayush Chatterjee
    </p>

    <p>
        © 2026. All rights reserved.
    </p>

</footer>


<script
    type="module"
    src="app.js"
></script>

</body>
</html>
